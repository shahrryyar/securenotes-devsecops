[project]
name = "securenotes"
version = "1.0.0"
description = "Target application for an automated DevSecOps (SAST/SCA/DAST) pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
# Tests use `assert` and attack payloads on purpose.
exclude_dirs = ["tests", ".venv", "venv"]
