# "Shift left": run the fastest security checks on every developer machine
# before code is even committed. The CI pipeline runs the full set again.
#   pip install pre-commit && pre-commit install
# Hooks are pinned to commit SHAs (the comment shows the version).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/semgrep/pre-commit
    rev: dfdeebdd309a043859ba33a555839911e7b11801 # v1.182.1
    hooks:
      - id: semgrep
        args: ["--config", "security/semgrep-rules", "--error", "--skip-unknown-extensions"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
