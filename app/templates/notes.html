{% extends "base.html" %}
{% block content %}
<h1>My notes</h1>
<form method="post" class="card">
  {{ csrf_field() }}
  <label>Title <input name="title" required maxlength="200"></label>
  <label>Body <textarea name="body" rows="4"></textarea></label>
  <button type="submit">Add note</button>
</form>
<ul class="list">
  {% for note in notes %}
    <li><a href="{{ url_for('notes.view_note', note_id=note['id']) }}">{{ note['title'] }}</a> <small>{{ note['created_at'] }}</small></li>
  {% else %}
    <li>No notes yet.</li>
  {% endfor %}
</ul>
{% endblock %}
