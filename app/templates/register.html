{% extends "base.html" %}
{% block title %}Register · SecureNotes{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post">
  {{ csrf_field() }}
  <label>Username <input name="username" required minlength="3" maxlength="32" autocomplete="username"></label>
  <label>Password (12+ characters) <input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
  <button type="submit">Register</button>
</form>
{% endblock %}
