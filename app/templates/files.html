{% extends "base.html" %}
{% block content %}
<h1>My files</h1>
<form method="post" enctype="multipart/form-data" class="card">
  {{ csrf_field() }}
  <input type="file" name="file" required>
  <button type="submit">Upload</button>
</form>
<ul class="list">
  {% for name in files %}
    <li><a href="{{ url_for('notes.download_file', name=name) }}">{{ name }}</a></li>
  {% else %}
    <li>No files yet.</li>
  {% endfor %}
</ul>
{% endblock %}
