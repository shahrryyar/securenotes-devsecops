{% extends "base.html" %}
{% block title %}{{ note['title'] }} · SecureNotes{% endblock %}
{% block content %}
<h1>{{ note['title'] }}</h1>
<p><small>{{ note['created_at'] }}</small></p>
<pre class="card">{{ note['body'] }}</pre>
<form method="post" action="{{ url_for('notes.export_note', note_id=note['id']) }}" class="inline">
  {{ csrf_field() }}
  <input name="filename" placeholder="file name" maxlength="64">
  <button type="submit">Export</button>
</form>
<form method="post" action="{{ url_for('notes.delete_note', note_id=note['id']) }}" class="inline">
  {{ csrf_field() }}
  <button type="submit" class="danger">Delete</button>
</form>
{% endblock %}
