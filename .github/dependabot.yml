# Dependabot keeps every pinned version, hash and digest up to date.
# Each update arrives as a pull request and must pass the full DevSecOps pipeline.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/security"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, security]
