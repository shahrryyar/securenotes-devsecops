# DevSecOps pipeline for SecureNotes.
#
# Stage 1 (parallel): build & test, SAST, SCA, secrets, container, DAST, pipeline security.
# Stage 2: the security gate collects every report, applies security/policy.yml
#          and passes or blocks the change. It is the only required status check.
#
# Hardening of the pipeline itself (it is part of the attack surface):
#   * every action is pinned to a full commit SHA, every image to a digest
#     (mutable tags were abused in the March 2026 Trivy compromise, CVE-2026-33634)
#   * `permissions: {}` at the top; each job requests only what it needs
#   * checkout never persists the token; no `${{ }}` expressions inside `run:` scripts
#   * Dependabot keeps all pins up to date (.github/dependabot.yml)

name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly re-scan: finds CVEs published after the code was merged
  workflow_dispatch:
    inputs:
      dast_mode:
        description: "OWASP ZAP scan type"
        type: choice
        options: [baseline, full]
        default: baseline

permissions: {}

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  SEMGREP_IMAGE: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  # ---------------------------------------------------------------- Build & test
  unit-tests:
    name: Build & unit/security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-tests
          path: reports/junit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- SAST
  sast-semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep (registry packs + custom project rules)
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check \
              --config p/python --config p/flask --config p/owasp-top-ten \
              --config p/secrets --config p/dockerfile --config p/github-actions \
              --config security/semgrep-rules \
              --sarif --output reports/semgrep.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/semgrep.sarif') != ''
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-semgrep
          path: reports/
          if-no-files-found: ignore

  sast-bandit:
    name: SAST · Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked security tools
        run: pip install --require-hashes -r security/requirements-tools.txt
      - name: Run Bandit
        run: |
          mkdir -p reports
          # Exit code 1 only means "issues found"; the security gate decides.
          bandit -c pyproject.toml -r app wsgi.py -f sarif -o reports/bandit.sarif || [ "$?" = 1 ]
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/bandit.sarif') != ''
        with:
          sarif_file: reports/bandit.sarif
          category: bandit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-bandit
          path: reports/
          if-no-files-found: ignore

  sast-codeql:
    name: SAST · CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
      actions: read # CodeQL reads workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql-${{ matrix.language }}
          output: reports/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-codeql-${{ matrix.language }}
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- SCA (dependencies)
  sca-pip-audit:
    name: SCA · pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked security tools
        run: pip install --require-hashes -r security/requirements-tools.txt
      - name: Audit pinned dependencies against the PyPI / OSV advisory database
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -r requirements-dev.txt --disable-pip --require-hashes \
            --format json --output reports/pip-audit.json || [ "$?" = 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-pip-audit
          path: reports/
          if-no-files-found: ignore

  sca-trivy:
    name: SCA · Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies, IaC misconfigurations and secrets
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" "$TRIVY_IMAGE" \
            fs --cache-dir /tmp/trivy --no-progress --scanners vuln,misconfig,secret \
            --skip-dirs /src/tests --skip-dirs /src/docs \
            --format sarif --output /src/reports/trivy-fs.sarif /src
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/trivy-fs.sarif') != ''
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-trivy-fs
          path: reports/
          if-no-files-found: ignore

  dependency-review:
    name: SCA · Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # post the dependency summary on the PR
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later

  # ---------------------------------------------------------------- Secrets
  secrets-gitleaks:
    name: Secrets · Gitleaks (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan every commit, not only the latest snapshot
      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 0 \
            --report-format sarif --report-path /repo/reports/gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-gitleaks
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Container
  container:
    name: Container · Hadolint + Trivy image + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (Hadolint)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            hadolint --no-fail --format sarif Dockerfile > reports/hadolint.sarif
      - name: Build image
        run: |
          docker build --pull -t securenotes:ci .
          docker save securenotes:ci -o "$RUNNER_TEMP/image.tar"
      - name: Scan image for OS and library CVEs (Trivy)
        run: |
          # --ignore-unfixed: only report CVEs that have a patched version we can move to.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$RUNNER_TEMP:/scan:ro" "$TRIVY_IMAGE" \
            image --cache-dir /tmp/trivy --no-progress --input /scan/image.tar --scanners vuln --ignore-unfixed \
            --format sarif --output /src/reports/trivy-image.sarif
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$RUNNER_TEMP:/scan:ro" "$TRIVY_IMAGE" \
            image --cache-dir /tmp/trivy --no-progress --input /scan/image.tar \
            --format cyclonedx --output /src/reports/sbom.cdx.json
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/hadolint.sarif') != ''
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/trivy-image.sarif') != ''
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-container
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- DAST
  dast-zap:
    name: DAST · OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DAST_MODE: ${{ inputs.dast_mode || 'baseline' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the application container
        run: |
          docker build -t securenotes:dast .
          docker run -d --name app -p 8000:8000 \
            -e SESSION_COOKIE_SECURE=false -e SECRET_KEY="$(openssl rand -hex 32)" securenotes:dast
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/login && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - name: Run ZAP scan against the running app
        run: |
          mkdir -p reports zap
          chmod 777 zap # the ZAP container runs as its own user
          if [ "$DAST_MODE" = "full" ]; then script=zap-full-scan.py; else script=zap-baseline.py; fi
          # -I: don't fail on warnings; the security gate applies the policy.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            "$script" -t http://localhost:8000 -J zap.json -r zap.html -I
          cp zap/zap.json zap/zap.html reports/
      - name: Application logs
        if: always()
        run: docker logs app || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-zap
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Pipeline security
  pipeline-security:
    name: CI/CD security · zizmor + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked security tools
        run: pip install --require-hashes -r security/requirements-tools.txt
      - name: Audit workflows for insecure patterns (zizmor)
        env:
          GH_TOKEN: ${{ github.token }} # enables online checks for known-vulnerable actions
        run: |
          mkdir -p reports
          zizmor --format sarif .github/workflows > reports/zizmor.sarif || true
          python -c "import json; json.load(open('reports/zizmor.sarif'))" # fail closed on a broken report
      - name: Lint workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color=false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('reports/zizmor.sarif') != ''
        with:
          sarif_file: reports/zizmor.sarif
          category: zizmor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-zizmor
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Security gate
  security-gate:
    name: Security gate
    if: always()
    needs:
      - unit-tests
      - sast-semgrep
      - sast-bandit
      - sast-codeql
      - sca-pip-audit
      - sca-trivy
      - dependency-review
      - secrets-gitleaks
      - container
      - dast-zap
      - pipeline-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post the gate summary as a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Benchmark scanners against planted vulnerabilities
        run: python scripts/benchmark.py --reports reports --output reports/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Apply security policy
        id: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python scripts/security_gate.py --reports reports --policy security/policy.yml --summary "$GITHUB_STEP_SUMMARY" --output reports/gate.md
      - name: Comment the result on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat reports/gate.md reports/benchmark.md > reports/pr-comment.md 2>/dev/null || true
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reports/pr-comment.md --edit-last --create-if-none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-gate-report
          path: reports/
